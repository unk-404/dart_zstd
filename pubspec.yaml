name: zstd_neo
description: >-
  Pure Dart implementation of Zstandard (zstd): a complete decoder and a
  streaming encoder, running on the Dart VM, JavaScript and WebAssembly.
version: 0.2.0
repository: https://github.com/unk-404/dart_zstd
topics:
  - zstd
  - zstandard
  - compression
  - codec

environment:
  sdk: ^3.13.5

dependencies:
  blit: ^0.1.4

dev_dependencies:
  benchmark_test: ^0.1.2
  lints: ^6.0.0
  test: ^1.31.1
